name: Deploy Word Runner to GitHub Pages

# Publishes the self-contained reader in kindle-reader/ to GitHub Pages.
# Deploys from this feature branch (not main) so main stays untouched.
on:
  push:
    branches: [claude/kindle-reader-web-app-cojr89]
    paths:
      - "kindle-reader/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Upload only the reader folder so it becomes the site root.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kindle-reader

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
